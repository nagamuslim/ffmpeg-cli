name: Publish to npm

on:
  push:
    branches:
      - main
      - ffmpeg4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine dist-tag
        id: dist_tag
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "ffmpeg4" ]; then
            echo "tag=ffmpeg4" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: npm publish --access=public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Add ffmpeg9 dist-tag (main branch)
        if: steps.dist_tag.outputs.is_main == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add @nagamuslim/ffmpeg-cli@$VERSION ffmpeg9
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
