name: Publish Package

on:
  push:
    branches:
      - main
      - ffmpeg4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Authenticate Registries
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          fi

      - name: Determine dist-tag
        id: dist_tag
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "ffmpeg4" ]; then
            echo "tag=ffmpeg4" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --tag ${{ steps.dist_tag.outputs.tag }}

      - name: Publish to npm Registry
        if: env.NPM_TOKEN != ''
        run: npm publish --registry=https://registry.npmjs.org --access=public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
